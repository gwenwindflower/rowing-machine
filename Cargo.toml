[package]
name = "rowing-machine"
version = "0.1.0"
edition = "2024"
description = "Deterministic synthetic data generator for SQL training and analytics demos"
authors = ["Gwyneth Windflower"]
license = "MIT"
repository = "https://github.com/gwenwindflower/rowing-machine"
readme = "README.md"
keywords = ["cli", "synthetic-data", "sql", "analytics", "ecommerce"]
categories = ["command-line-utilities", "simulation"]
include = ["Cargo.lock", "Cargo.toml", "LICENSE", "README.md", "src/**", "themes/**", "benches/**", "examples/*.rs", "tests/*.rs", "tests/support/*.rs", "tests/fixtures/**"]

[[bin]]
name = "rowing-machine"
path = "src/main.rs"

[[bench]]
name = "ecommerce"
harness = false

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
csv = "1.3"
flate2 = "1"
indicatif = "0.18"
jiff = "0.2"
rand = "0.9"
rand_core = "0.9"
rand_distr = "0.5"
rand_pcg = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.7"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
codegen-units = 1

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]
